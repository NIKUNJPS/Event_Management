<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Event Details</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="nav">
    <div class="container nav-inner">

      <a class="brand" href="index.html">
        Evently
      </a>

      <div class="nav-links">

        <a href="events.html">
          Events
        </a>

        <a href="bookings.html">
          My Bookings
        </a>

        <button class="btn secondary" onclick="logout()">
          Logout
        </button>

      </div>

    </div>
  </nav>

  <main class="section">
    <div class="container">

      <h1 id="title">
        Loading...
      </h1>

      <p id="info" class="muted"></p>

      <p id="description"></p>

      <h2>
        Select Seats
      </h2>

      <div id="seats" class="seats"></div>

      <div class="summary">

        <div class="row">
          <strong>Total</strong>
          <strong id="total">
            ₹0
          </strong>
        </div>

        <button id="book" class="btn">
          Book Selected Seats
        </button>

        <div id="msg"></div>

      </div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/booking.js"></script>

  <script>
    loadDetails().catch(
      e =>
        document.getElementById('msg').innerHTML =
          '<div class="notice error">' +
          e.message +
          '</div>'
    );
  </script>

</body>
</html>
