<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="container">

    <form
      class="form"
      onsubmit="event.preventDefault(); submitAuth('register')"
    >
      <h1>
        Create account
      </h1>
      <div id="msg" class="notice error"></div>

      <label>
        Name
      </label>

      <input
        id="name"
        class="input"
        required
      >

      <label>
        Email
      </label>

      <input
        id="email"
        class="input"
        type="email"
        required
      >

      <label>
        Password
      </label>

      <input
        id="password"
        class="input"
        type="password"
        minlength="6"
        required
      >

      <button class="btn">
        Register
      </button>

      <p class="muted">
        Already registered?
        <a href="login.html">
          Login
        </a>
      </p>

    </form>

  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
