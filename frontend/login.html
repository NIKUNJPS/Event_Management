<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="container">

    <form
      class="form"
      onsubmit="event.preventDefault(); submitAuth('login')"
    >

      <h1>
        Login
      </h1>

      <div id="msg" class="notice error"></div>

      <label>
        Email
      </label>

      <input
        id="email"
        class="input"
        type="email"
        required
      >

      <label>
        Password
      </label>

      <input
        id="password"
        class="input"
        type="password"
        required
      >

      <button class="btn">
        Login
      </button>

      <p class="muted">
        New here?
        <a href="register.html">
          Create an account
        </a>
      </p>

    </form>

  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
