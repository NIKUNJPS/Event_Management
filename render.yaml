# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo
services:
  - type: web
    name: evently-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # MongoDB Atlas connection string; set it in the dashboard (Environment tab), never in git
      - key: MONGODB_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: https://evently.onrender.com
      # Render added a random suffix to the static site's hostname
      - key: CORS_ORIGIN_REGEX
        value: https://evently(-[a-z0-9]+)?\.onrender\.com

  - type: web
    name: evently
    runtime: static
    rootDir: frontend
    buildCommand: echo "No build step"
    staticPublishPath: .
