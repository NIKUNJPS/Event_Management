# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo
services:
  - type: web
    name: evently-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: evently-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: https://evently.onrender.com

  - type: web
    name: evently
    runtime: static
    rootDir: frontend
    buildCommand: echo "No build step"
    staticPublishPath: .

databases:
  - name: evently-db
    plan: free
    databaseName: event_booking
    user: evently
